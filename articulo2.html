<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi segundo artículo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background-color: #f5f5f5;
        }

        .articulo {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        a {
            color: #0366d6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="articulo">

        <h1>Mi segundo artículo</h1>

        <p>
            Ahora estamos en otra página.
        </p>

        <p>
            Esto demuestra que podemos tener múltiples
            artículos dentro de nuestro sitio.
        </p>

        <h2>¿Cómo funciona?</h2>

        <p>
            Cada archivo HTML representa una página
            diferente del sitio.
        </p>

        <p>
            <a href="index.html">
                ← Volver al inicio
            </a>
        </p>

    </div>

</body>
</html>
